name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck jq
          shellcheck scripts/*.sh tests/*.sh install.sh
      - name: no comments in this repo's code
        run: scripts/find-comments.sh $(git ls-files '*.sh' '*.py' '*.yml' '*.yaml' install.sh | grep -v '^tests/fixtures/')
      - name: hook script tests
        run: tests/run-tests.sh
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: CRAP scorer tests
        run: |
          python -m pip install -q lizard
          PYTHON=python tests/crap-score.sh
      - name: codebase graph tests
        run: PYTHON=python tests/codebase-graph.sh
      - name: mutation adapter tests
        run: PYTHON=python tests/mutation-report.sh
      - name: manifest validation
        run: scripts/validate-manifests.sh
      - name: scripts are executable in the repo
        run: |
          bad=$(git ls-files -s ':(glob)scripts/*.sh' ':(glob)scripts/*.py' ':(glob)tests/*.sh' install.sh | grep -v ^100755 || true)
          if [ -n "$bad" ]; then echo "not executable: $bad"; exit 1; fi
      - name: settings.json is valid JSON
        run: jq empty settings.json

  crap-stacks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Python, React and Java samples through the real gate
        run: |
          python -m pip install -q lizard coverage pytest
          PYTHON=python tests/crap-stacks.sh

  mutation-stacks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Python sample with mutmut through the real gate
        run: |
          python -m pip install -q mutmut pytest
          PYTHON=python tests/mutation-stacks.sh

  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: hook script tests
        run: tests/run-tests.sh
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: CRAP scorer tests
        run: |
          python -m pip install -q lizard
          PYTHON=python tests/crap-score.sh
      - name: mutation adapter tests
        run: PYTHON=python tests/mutation-report.sh
      - name: install from Git Bash and make a demo project
        if: runner.os == 'Windows'
        run: |
          ./install.sh >/dev/null
          demo="$(cygpath -u "$RUNNER_TEMP")/demo"
          git init -q -b main "$demo"
          git -C "$demo" config user.email ci@example.com
          git -C "$demo" config user.name ci
          mkdir -p "$demo/vault"
          printf '%s\n' '# Demo' '## Gate' '- gate.test: echo ok' '- gate.test.focus: printf "<%s>" {}' '- gate.crap: printf "demo.txt:1-1 2.5 f\r\n"' '- gate.mutation: printf "demo.txt:1 killed m\r\n"' > "$demo/vault/project.md"
          git -C "$demo" add -A
          git -C "$demo" commit -q -m init
          git -C "$demo" checkout -q -b slice/S001
          echo touched > "$demo/demo.txt"
          git -C "$demo" add -A
          git -C "$demo" commit -q -m "feat: touch demo.txt"
      - name: gate.sh from PowerShell 7 through Git Bash, as AGENTS.md tells Cursor and Copilot
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}/demo
        run: |
          & "$env:ProgramFiles\Git\bin\bash.exe" -c '~/.claude/scripts/gate.sh test -- one ''two words'''
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $log = (Get-Content -Raw .gate/test.log).Trim()
          if ($log -ne '<one><two words>') { Write-Error "test.log was: $log"; exit 1 }
      - name: gate.sh from Windows PowerShell 5.1 through Git Bash
        if: runner.os == 'Windows'
        shell: powershell
        working-directory: ${{ runner.temp }}/demo
        run: |
          & "$env:ProgramFiles\Git\bin\bash.exe" -c '~/.claude/scripts/gate.sh test -- one ''two words'''
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $log = (Get-Content -Raw .gate/test.log).Trim()
          if ($log -ne '<one><two words>') { Write-Error "test.log was: $log"; exit 1 }
      - name: gate.sh crap step from PowerShell 7 through Git Bash
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}/demo
        run: |
          $out = & "$env:ProgramFiles\Git\bin\bash.exe" -c '~/.claude/scripts/gate.sh crap'
          if ($LASTEXITCODE -ne 0) { Write-Error ($out -join "`n"); exit 1 }
          if (-not ($out -match 'crap PASS .* highest touched: f 2\.5')) { Write-Error ($out -join "`n"); exit 1 }
      - name: gate.sh crap step from Windows PowerShell 5.1 through Git Bash
        if: runner.os == 'Windows'
        shell: powershell
        working-directory: ${{ runner.temp }}/demo
        run: |
          $out = & "$env:ProgramFiles\Git\bin\bash.exe" -c '~/.claude/scripts/gate.sh crap'
          if ($LASTEXITCODE -ne 0) { Write-Error ($out -join "`n"); exit 1 }
          if (-not ($out -match 'crap PASS .* highest touched: f 2\.5')) { Write-Error ($out -join "`n"); exit 1 }
      - name: gate.sh mutation step from PowerShell 7 through Git Bash
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}/demo
        run: |
          $out = & "$env:ProgramFiles\Git\bin\bash.exe" -c '~/.claude/scripts/gate.sh mutation'
          if ($LASTEXITCODE -ne 0) { Write-Error ($out -join "`n"); exit 1 }
          if (-not ($out -match 'mutation PASS .* score 100% on 1 touched mutants')) { Write-Error ($out -join "`n"); exit 1 }
