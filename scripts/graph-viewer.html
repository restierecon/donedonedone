<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codebase Map</title>
<style>
:root {
  --bg: #fbfaf8; --panel: #ffffff; --ink: #1d1c1a; --muted: #6b6862; --line: #d9d5ce;
  --edge: #a9a49b; --accent: #2f5fd0; --high: #c4372b; --medium: #b7791f; --low: #3b7a57;
  --high-bg: #fbe9e7; --medium-bg: #fdf3e1; --low-bg: #e8f3ec; --chip: #f1eee9; --flow: #5b4fc4; --flow-bg: #eeecfb;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161514; --panel: #1f1e1c; --ink: #ece9e4; --muted: #a29e96; --line: #3a3835;
    --edge: #6d6962; --accent: #7aa2ff; --high: #ff7b6e; --medium: #f0b45a; --low: #6cc596;
    --high-bg: #3a1f1c; --medium-bg: #36291a; --low-bg: #1c3127; --chip: #2a2826; --flow: #a99ffb; --flow-bg: #26233d;
  }
}
:root[data-theme="dark"] {
  --bg: #161514; --panel: #1f1e1c; --ink: #ece9e4; --muted: #a29e96; --line: #3a3835;
  --edge: #6d6962; --accent: #7aa2ff; --high: #ff7b6e; --medium: #f0b45a; --low: #6cc596;
  --high-bg: #3a1f1c; --medium-bg: #36291a; --low-bg: #1c3127; --chip: #2a2826; --flow: #a99ffb; --flow-bg: #26233d;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
h1 { font-size: 17px; margin: 0; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 16px; padding: 3px 12px; cursor: pointer; font: inherit; }
.tabs button.on { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.controls { margin-left: auto; display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--muted); }
#seen { padding: 6px 16px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; }
#seen.warn { color: var(--medium); }
main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 440px); min-height: calc(100vh - 90px); }
#canvas { overflow: auto; border-right: 1px solid var(--line); }
#panel { background: var(--panel); padding: 14px 16px; overflow: auto; max-height: calc(100vh - 90px); }
@media (max-width: 820px) {
  main { grid-template-columns: 1fr; }
  #canvas { border-right: 0; border-bottom: 1px solid var(--line); max-height: 60vh; }
  #panel { max-height: none; }
}
svg text { font: 12px system-ui, sans-serif; fill: var(--ink); pointer-events: none; }
svg text.kind { fill: var(--muted); font-size: 10px; }
svg text.elabel { fill: var(--muted); font-size: 10px; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.node rect { stroke: var(--line); stroke-width: 1.2; cursor: pointer; fill: var(--panel); }
.node.high rect { fill: var(--high-bg); stroke: var(--high); }
.node.medium rect { fill: var(--medium-bg); stroke: var(--medium); }
.node.low rect { fill: var(--low-bg); stroke: var(--low); }
.node.stage rect, .node.workflow rect { fill: var(--flow-bg); stroke: var(--flow); }
.node.stage.high rect { stroke: var(--high); }
.node.group rect { fill: var(--chip); stroke-dasharray: 4 3; }
.node.selected rect { stroke: var(--accent); stroke-width: 3; }
.edge { fill: none; stroke: var(--edge); stroke-width: 1.2; }
.edge.mention { stroke-dasharray: 2 3; opacity: .7; }
.edge.next { stroke: var(--flow); stroke-width: 1.8; }
.edge.cycle { stroke: var(--high); stroke-dasharray: 5 3; stroke-width: 1.6; }
.edge.out { stroke: var(--accent); stroke-width: 2.2; opacity: 1; }
.edge.in { stroke: var(--medium); stroke-width: 2.2; opacity: 1; }
.edge.dim { opacity: .12; }
.crumbs { color: var(--muted); margin-bottom: 8px; overflow-wrap: anywhere; }
.crumbs a, .link { color: var(--accent); cursor: pointer; text-decoration: none; }
.crumbs a:hover, .link:hover { text-decoration: underline; }
h2 { font-size: 16px; margin: 4px 0 6px; overflow-wrap: anywhere; }
h3 { font-size: 12px; margin: 16px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; background: var(--chip); color: var(--muted); margin-right: 4px; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
.badge.high { background: var(--high-bg); color: var(--high); }
.badge.medium { background: var(--medium-bg); color: var(--medium); }
.badge.low { background: var(--low-bg); color: var(--low); }
.desc { margin: 4px 0 8px; }
.metrics { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
.metric { background: var(--chip); border-radius: 6px; padding: 6px 8px; }
.metric b { display: block; font-size: 15px; overflow-wrap: anywhere; }
.metric span { color: var(--muted); font-size: 12px; }
ul { margin: 0; padding-left: 18px; }
li { margin: 3px 0; overflow-wrap: anywhere; }
.kind { font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: .04em; margin-right: 4px; }
.kind.high { color: var(--high); }
.kind.medium { color: var(--medium); }
.kind.info { color: var(--muted); }
.where { color: var(--muted); font-size: 12px; }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 10px; margin: 0; }
dt { color: var(--muted); }
dd { margin: 0; overflow-wrap: anywhere; }
.note { color: var(--muted); font-size: 12px; }
.empty { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
<header>
  <h1>Codebase Map</h1>
  <nav class="tabs" id="tabs"></nav>
  <span class="controls">
    <label><input type="checkbox" id="onlyFlagged"> flagged only</label>
    <label><input type="checkbox" id="showMentions"> doc mentions</label>
  </span>
</header>
<div id="seen"></div>
<main>
  <div id="canvas"><svg id="svg" role="img" aria-label="Map of the current level"></svg></div>
  <aside id="panel"></aside>
</main>
<script>
const G = __GRAPH_JSON__;
const E = G.entities;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const KIND_LABEL = { dir: "folder", file: "file", function: "function", stage: "stage", agent: "agent", skill: "skill", command: "command",
  "hook-event": "hook event", hook: "hook", group: "group", protocol: "protocol", workflow: "workflow" };
const EDGE_LABEL = { import: "imports", reference: "references", mention: "mentions", uses: "uses", runs: "runs", next: "then", names: "names in prose" };
const LEVEL_ORDER = { high: 0, medium: 1, info: 2 };
const incoming = {};
for (const e of Object.values(E)) for (const o of e.out) (incoming[o.to] = incoming[o.to] || []).push(Object.assign({ from: e.id }, o));
let lens = G.lenses.length > 1 ? G.lenses[1] : G.lenses[0];
let stack = [lens.root];
let selected = lens.root;

function focus() { return stack[stack.length - 1]; }
function short(label, max) { return label.length > max ? label.slice(0, max - 1) + "…" : label; }
function kids(id) { return (E[id] && E[id].children || []).filter(c => E[c]); }
function mentionsOn() { return $("showMentions").checked; }

function seenBanner() {
  const s = G.seen, total = Object.values(s.edges).reduce((a, b) => a + b, 0) || 1;
  const pct = v => Math.round(100 * (v || 0) / total) + "%";
  const cx = s.complexity, code = Object.entries(cx).filter(([k]) => k !== "n/a" && k !== "other").reduce((a, [, v]) => a + v, 0);
  const blind = (cx["not measured"] || 0) + (cx.unavailable || 0);
  let text = `Seen: ${s.files} text files, ${total} lines. Links: ${pct(s.edges["imports parsed"])} from parsed imports, ${pct(s.edges["references scanned"])} from name references. ` +
    `Complexity: ${pct(cx.measured)} measured, ${pct(cx.estimated)} estimated (shell), ${pct((cx["n/a"] || 0) + (cx.other || 0))} docs, data or other text.`;
  const skipped = Object.entries(s.skipped).filter(([, n]) => n).map(([k, n]) => `${n} ${k}`).join(", ");
  if (skipped) text += ` Skipped: ${skipped}.`;
  if (code && blind / code > 0.3) { text += ` Warning: ${Math.round(100 * blind / code)}% of code has no complexity measure.`; $("seen").className = "warn"; }
  $("seen").textContent = text;
}

function tabs() {
  $("tabs").innerHTML = G.lenses.map((l, i) => `<button data-lens="${i}" class="${l === lens ? "on" : ""}">${esc(l.id === "code" ? "Code" : "Workflow · " + l.label)}</button>`).join("");
  $("tabs").querySelectorAll("button").forEach(b => b.addEventListener("click", () => { lens = G.lenses[+b.dataset.lens]; stack = [lens.root]; selected = lens.root; refresh(); }));
}

function edgesAmong(id, shown) {
  const set = new Set(shown), out = [];
  const allow = k => k !== "mention" || mentionsOn();
  if (E[id].child_edges) {
    for (const e of E[id].child_edges) {
      const kinds = Object.keys(e.kinds).filter(allow);
      if (kinds.length && set.has(e.from) && set.has(e.to)) out.push({ from: e.from, to: e.to, kind: kinds.includes("import") ? "import" : kinds[0], count: kinds.reduce((a, k) => a + e.kinds[k], 0) });
    }
    return out;
  }
  for (const c of shown) for (const o of E[c].out) if (set.has(o.to) && o.to !== c && allow(o.kind)) out.push({ from: c, to: o.to, kind: o.kind, label: o.label });
  return out;
}

function kindText(id) { const inner = kids(id).length; return (KIND_LABEL[E[id].kind] || E[id].kind) + (inner ? " · " + inner + " inside ▸" : ""); }
function nodeWidth(id) { return Math.min(240, Math.max(110, 28 + 7 * short(E[id].label, 30).length, 24 + 6.2 * kindText(id).length)); }

function flowLayout(shown, edges) {
  const stages = shown.filter(c => E[c].kind === "stage"), rest = shown.filter(c => E[c].kind !== "stage");
  const pos = {}, routes = {}, index = {};
  stages.forEach((c, i) => { index[c] = i; pos[c] = { x: 24, y: 24 + i * 74, w: 220, h: 44 }; });
  const loops = edges.filter(e => index[e.from] !== undefined && index[e.to] !== undefined && index[e.to] !== index[e.from] + 1)
    .sort((a, b) => Math.abs(index[a.to] - index[a.from]) - Math.abs(index[b.to] - index[b.from]));
  const leaving = {}, arriving = {};
  loops.forEach((e, k) => {
    const a = pos[e.from], b = pos[e.to], lane = 24 + 220 + 28 + k * 30;
    const j = leaving[e.from] = (leaving[e.from] ?? -1) + 1, i = arriving[e.to] = (arriving[e.to] ?? -1) + 1;
    const ya = a.y + 12 + 10 * (j % 3), yb = b.y + 12 + 10 * (i % 3);
    routes[e.from + "|" + e.to] = { d: `M${a.x + a.w},${ya} H${lane} V${yb} H${b.x + b.w}`, mx: a.x + a.w + 6, my: ya - 3, anchor: "start" };
  });
  const groupsX = 24 + 220 + 28 + loops.length * 30 + 150;
  rest.forEach((c, i) => { pos[c] = { x: groupsX, y: 24 + i * 74, w: 200, h: 44 }; });
  return { pos, routes };
}

function layeredLayout(shown, edges, width) {
  const deps = {};
  edges.filter(e => e.kind !== "mention").forEach(e => (deps[e.from] = deps[e.from] || []).push(e.to));
  const level = {}, visiting = new Set();
  const lv = n => {
    if (level[n] !== undefined) return level[n];
    if (visiting.has(n)) return 0;
    visiting.add(n);
    let best = 0;
    for (const d of deps[n] || []) best = Math.max(best, lv(d) + 1);
    visiting.delete(n);
    return (level[n] = best);
  };
  shown.forEach(lv);
  const levels = [];
  shown.forEach(n => (levels[level[n]] = levels[level[n]] || []).push(n));
  const pos = {}, gap = 16, avail = Math.max(320, width - 40);
  let y = 24;
  for (let l = levels.length - 1; l >= 0; l--) {
    const row = (levels[l] || []).sort((a, b) => (LEVEL_ORDER[E[a].risk] ?? 3) - (LEVEL_ORDER[E[b].risk] ?? 3) || E[a].label.localeCompare(E[b].label));
    let x = 24;
    for (const n of row) {
      const w = nodeWidth(n);
      if (x + w > avail && x > 24) { x = 24; y += 62; }
      pos[n] = { x, y, w, h: 40 };
      x += w + gap;
    }
    if (row.length) y += 86;
  }
  return pos;
}

function edgePath(a, b) {
  const sameRow = Math.abs(a.y - b.y) < 5;
  if (sameRow && b.x > a.x) return { d: `M${a.x + a.w},${a.y + a.h / 2} L${b.x},${b.y + b.h / 2}`, mx: (a.x + a.w + b.x) / 2, my: a.y + a.h / 2 - 6 };
  if (sameRow) {
    const x1 = a.x + a.w / 2, x2 = b.x + b.w / 2;
    return { d: `M${x1},${a.y} C${x1},${a.y - 45} ${x2},${b.y - 45} ${x2},${b.y}`, mx: (x1 + x2) / 2, my: a.y - 38 };
  }
  if (b.y < a.y) {
    const x1 = a.x + a.w, x2 = b.x + b.w;
    return { d: `M${x1},${a.y + a.h / 2} C${x1 + 50},${a.y + a.h / 2} ${x2 + 50},${b.y + b.h / 2} ${x2},${b.y + b.h / 2}`, mx: Math.max(x1, x2) + 30, my: (a.y + b.y) / 2 };
  }
  const x1 = a.x + a.w / 2, y1 = a.y + a.h, x2 = b.x + b.w / 2, y2 = b.y;
  return { d: `M${x1},${y1} C${x1},${(y1 + y2) / 2} ${x2},${(y1 + y2) / 2} ${x2},${y2}`, mx: (x1 + x2) / 2, my: (y1 + y2) / 2 };
}

function draw() {
  const id = focus(), svg = $("svg");
  let shown = kids(id);
  if ($("onlyFlagged").checked) shown = shown.filter(c => E[c].risk && E[c].risk !== "low");
  const width = $("canvas").clientWidth || 800;
  if (!shown.length) {
    svg.setAttribute("width", 320); svg.setAttribute("height", 70); svg.removeAttribute("viewBox");
    svg.innerHTML = `<text x="20" y="40">${kids(id).length ? "Nothing matches the filters." : "Nothing inside — see the panel."}</text>`;
    return;
  }
  const edges = edgesAmong(id, shown);
  const flow = E[id].meta && E[id].meta.layout === "flow";
  const laid = flow ? flowLayout(shown, edges) : { pos: layeredLayout(shown, edges, width), routes: {} };
  const pos = laid.pos;
  const W = Math.max(...shown.map(c => pos[c].x + pos[c].w)) + 80, H = Math.max(...shown.map(c => pos[c].y + pos[c].h)) + 40;
  svg.setAttribute("width", W); svg.setAttribute("height", H); svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const cyc = new Set((G.module_cycles || []).flat().map(m => "dir:" + m));
  let html = '<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--edge)"/></marker></defs>';
  for (const e of edges) {
    let cls = "edge " + e.kind;
    if (cyc.has(e.from) && cyc.has(e.to)) cls += " cycle";
    if (selected !== id && shown.includes(selected)) cls += e.from === selected ? " out" : e.to === selected ? " in" : " dim";
    const p = laid.routes[e.from + "|" + e.to] || edgePath(pos[e.from], pos[e.to]);
    const title = `${E[e.from].label} ${EDGE_LABEL[e.kind] || e.kind} ${E[e.to].label}${e.count ? " (" + e.count + " links)" : ""}`;
    html += `<path class="${cls}" d="${p.d}" marker-end="url(#arrow)"><title>${esc(title)}</title></path>`;
    if (e.label) html += `<text class="elabel" x="${p.mx}" y="${p.my}" text-anchor="${p.anchor || "middle"}">${esc(short(e.label, 30))}</text>`;
  }
  for (const c of shown) {
    const p = pos[c], n = E[c];
    const cls = `node ${n.kind} ${n.risk || "low"}${c === selected ? " selected" : ""}`;
    html += `<g class="${cls}" data-id="${esc(c)}" tabindex="0"><title>${esc(n.label)} — ${esc(KIND_LABEL[n.kind] || n.kind)}${n.risk && n.risk !== "low" ? ", " + n.risk + " risk" : ""}</title>` +
      `<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="7"/>` +
      `<text class="kind" x="${p.x + 9}" y="${p.y + 13}">${esc(kindText(c))}</text>` +
      `<text x="${p.x + 9}" y="${p.y + p.h - 9}">${esc(short(n.label, Math.floor((p.w - 18) / 7)))}${n.flags.length ? " ●" : ""}</text></g>`;
  }
  svg.innerHTML = html;
  svg.querySelectorAll(".node").forEach(g => {
    const go = () => open(g.dataset.id);
    g.addEventListener("click", go);
    g.addEventListener("keydown", ev => { if (ev.key === "Enter") go(); });
  });
}

function open(id) {
  if (!E[id]) return;
  if (kids(id).length && !stack.includes(id)) stack.push(id);
  selected = id;
  refresh();
}

function jump(id) {
  if (!E[id]) return;
  const chain = [];
  let cur = kids(id).length ? id : E[id].parent;
  while (cur && E[cur] && !chain.includes(cur)) { chain.unshift(cur); cur = E[cur].parent; }
  lens = G.lenses.find(l => l.root === chain[0]) || G.lenses.find(l => l.id === (E[id].lens || "code")) || lens;
  stack = chain.length && chain[0] === lens.root ? chain : [lens.root].concat(chain);
  selected = id;
  refresh();
}

function link(id) {
  const n = E[id];
  return n ? `<a class="link" data-jump="${esc(id)}">${esc(n.kind === "file" ? n.path : n.label)}</a> <span class="chip">${esc(KIND_LABEL[n.kind] || n.kind)}</span>` : esc(id);
}

function valueHtml(v) {
  if (Array.isArray(v)) return v.length ? v.map(valueHtml).join(", ") : "—";
  if (typeof v === "string" && E["file:" + v]) return `<a class="link" data-jump="${esc("file:" + v)}">${esc(v)}</a>`;
  if (typeof v === "string" && v.includes("/") && E["dir:" + v]) return `<a class="link" data-jump="${esc("dir:" + v)}">${esc(v)}</a>`;
  return esc(typeof v === "boolean" ? (v ? "yes" : "no") : v);
}

function flagsBelow(id, depth, acc) {
  if (depth > 4 || acc.length > 60) return acc;
  for (const c of kids(id)) {
    for (const f of E[c].flags) acc.push(Object.assign({ owner: c }, f));
    if (E[c].kind === "dir" || E[c].kind === "file" || E[c].kind === "group" || E[c].kind === "hook-event") flagsBelow(c, depth + 1, acc);
  }
  return acc;
}

function whyHtml(n) {
  const own = n.flags.map(f => Object.assign({ owner: n.id }, f));
  const below = ["dir", "file", "workflow", "group", "hook-event"].includes(n.kind) ? flagsBelow(n.id, 0, []) : [];
  const seen = new Set();
  const all = own.concat(below).filter(f => { const k = f.owner + f.why; if (seen.has(k)) return false; seen.add(k); return true; })
    .sort((a, b) => LEVEL_ORDER[a.level] - LEVEL_ORDER[b.level]);
  if (!all.length) return '<p class="empty">Nothing highlighted.</p>';
  return "<ul>" + all.slice(0, 40).map(f => `<li><span class="kind ${f.level}">${esc(f.kind)}</span>${f.owner !== n.id ? link(f.owner) + ": " : ""}${esc(f.why)}</li>`).join("") +
    (all.length > 40 ? `<li class="note">…and ${all.length - 40} more</li>` : "") + "</ul>";
}

function edgeList(list, dir) {
  const rows = list.filter(o => (o.kind !== "mention" || mentionsOn()) && E[dir === "out" ? o.to : o.from]);
  const hidden = list.filter(o => o.kind === "mention").length;
  if (!rows.length) return `<p class="empty">None${hidden && !mentionsOn() ? ` (${hidden} doc mentions hidden)` : ""}.</p>`;
  const groups = {};
  rows.forEach(o => (groups[o.kind] = groups[o.kind] || []).push(o));
  return Object.entries(groups).map(([k, os]) => `<p class="note">${esc(EDGE_LABEL[k] || k)} (${os.length})</p><ul>` +
    os.slice(0, 60).map(o => `<li>${link(dir === "out" ? o.to : o.from)}${o.label ? " — " + esc(o.label) : ""}${o.where ? ` <span class="where">${esc(o.where)}</span>` : ""}</li>`).join("") +
    (os.length > 60 ? `<li class="note">…and ${os.length - 60} more</li>` : "") + "</ul>").join("") +
    (hidden && !mentionsOn() ? `<p class="note">${hidden} doc mentions hidden.</p>` : "");
}

function metricValue(k, v) {
  if (v === null || v === undefined) return "—";
  return k === "coverage" ? Math.round(v * 100) + "%" : v;
}

function panel() {
  const n = E[selected];
  const crumbs = stack.map((s, i) => i === stack.length - 1 && s === selected ? esc(E[s].label) : `<a data-depth="${i}">${esc(E[s].label)}</a>`).join(" › ") +
    (focus() !== selected ? " › " + esc(n.label) : "");
  let h = `<div class="crumbs">${crumbs}</div><h2>${esc(n.kind === "file" ? n.path : n.label)}</h2>` +
    `<span class="chip">${esc(KIND_LABEL[n.kind] || n.kind)}</span>${n.risk && n.risk !== "low" ? `<span class="badge ${n.risk}">${n.risk} risk</span>` : ""}`;
  if (n.description) h += `<p class="desc">${esc(n.description)}</p>`;
  const metrics = Object.entries(n.metrics || {});
  if (metrics.length) h += '<div class="metrics">' + metrics.map(([k, v]) => `<div class="metric"><b>${esc(metricValue(k, v))}</b><span>${esc(k)}</span></div>`).join("") + "</div>";
  if (n.kind === "dir") h += '<p class="note">Instability = fan-out ÷ (fan-in + fan-out). Near 0, many depend on it, so keep it stable; near 1, it leans on others and is cheap to change.</p>';
  h += "<h3>Why it's highlighted</h3>" + whyHtml(n);
  const meta = Object.entries(n.meta || {}).filter(([k, v]) => k !== "layout" && !(Array.isArray(v) && !v.length));
  if (meta.length) h += "<h3>Details</h3><dl>" + meta.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${valueHtml(v)}</dd>`).join("") + "</dl>";
  const inner = kids(selected);
  if (inner.length) h += `<h3>Inside (${inner.length})</h3><ul>` + inner.slice(0, 80).map(c => `<li>${link(c)}${E[c].risk && E[c].risk !== "low" ? ` <span class="badge ${E[c].risk}">${E[c].risk}</span>` : ""}</li>`).join("") + (inner.length > 80 ? `<li class="note">…and ${inner.length - 80} more</li>` : "") + "</ul>";
  h += "<h3>Depends on / leads to</h3>" + edgeList(n.out, "out");
  h += "<h3>Used by</h3>" + edgeList(incoming[selected] || [], "in");
  if (n.id === "dir:." && G.facts && G.facts.length) h += factsHtml();
  if (n.id === lens.root) h += lensNotes();
  $("panel").innerHTML = h;
  $("panel").querySelectorAll("[data-jump]").forEach(a => a.addEventListener("click", () => jump(a.dataset.jump)));
  $("panel").querySelectorAll("[data-depth]").forEach(a => a.addEventListener("click", () => { stack = stack.slice(0, +a.dataset.depth + 1); selected = focus(); refresh(); }));
}

function evidenceHtml(ev) {
  const m = ev.match(/^([^\s:]+)(.*)$/);
  return m && E["file:" + m[1]] ? `<a class="link" data-jump="${esc("file:" + m[1])}">${esc(m[1])}</a>${esc(m[2])}` : esc(ev);
}

function factsHtml() {
  return "<h3>Facts (with evidence)</h3>" + G.facts.map(s => `<p class="note"><b>${esc(s.section)}</b></p><ul>` +
    s.items.map(i => `<li>${i.level !== "info" ? `<span class="kind ${i.level === "ask" ? "high" : "medium"}">${i.level === "ask" ? "ask user" : "todo"}</span>` : ""}${esc(i.fact.replace(/^\[(TODO|ASK USER)\] /, ""))}` +
      (i.evidence.length ? `<br><span class="where">${i.evidence.map(evidenceHtml).join(" · ")}</span>` : "") + "</li>").join("") + "</ul>").join("");
}

function lensNotes() {
  if (lens.id === "code") return '<h3>How to read it</h3><p class="note">Arrows point from what depends to what it depends on, and dependents sit above. Solid arrows are parsed imports, or references from scripts and config. Dotted arrows (turn on "doc mentions") are mentions in docs or in code strings. Click a box to go inside it. Flags are prompts to look, not verdicts: a long function that reads well can be fine, and a tiny one that only forwards calls can still be a problem.</p>';
  const problems = lens.problems || [];
  return "<h3>Workflow check</h3>" + (problems.length ? "<ul>" + problems.map(p => `<li><span class="kind ${p.level === "error" ? "high" : "medium"}">${esc(p.level)}</span>${esc(p.message)}</li>`).join("") + "</ul>" : '<p class="note">Every stage resolves, and every agent, skill and command is reachable.</p>') +
    '<p class="note">Stages run in order, and purple arrows are the declared flow, with labels on the loops. Click a stage to see the agents, skills and scripts it uses, then keep clicking down to hooks, scripts and functions. Links between components come from the paths and names in their files.</p>';
}

function refresh() { tabs(); draw(); panel(); }

$("onlyFlagged").addEventListener("change", draw);
$("showMentions").addEventListener("change", () => { draw(); panel(); });
window.addEventListener("resize", draw);
seenBanner();
refresh();
</script>
</body>
</html>
